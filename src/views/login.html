<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SipSprout • Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>

        <a href="./dashboard.html" class="back-link">← На главную</a>

        <div class="auth-card">
            <div class="fill-bar"><span></span></div>

            <div class="auth-card-header">
                <div class="logo">
                    <span class="logo-emoji">🌱</span> SipSprout
                </div>
                <h2>С возвращением!</h2>
                <p class="auth-subtitle">Войдите, чтобы продолжить растить свой сад.</p>
            </div>

            <div class="auth-switch">
                <a href="./login.html" class="switch-btn active">Вход</a>
                <a href="./signup.html" class="switch-btn">Регистрация</a>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <div class="password-header">
                        <label>🔒 Пароль</label>
                        <a href="#" class="forgot-link">Забыли пароль?</a>
                    </div>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-solid full-width">Войти</button>
            </form>
        </div>
    </div>

    <script src="../scripts/main.js"></script>
</body>
</html>
